# Scrape MTTDB + regional JSON → upsert poker_tournament_events on production.
#
# Primary schedule is Windows Task Scheduler on the home PC
# (`scripts/install-poker-catalog-windows-task.ps1`, daily 2:00 AM local).
# This workflow is manual only (workflow_dispatch). Do not re-add ubuntu-latest
# cron … GitHub cloud egress cannot pass MTTDB Cloudflare.
#
# Required GitHub repo secrets (Settings → Secrets → Actions):
#   SUPABASE_URL_PRODUCTION
#   SUPABASE_SERVICE_ROLE_KEY_PRODUCTION
#
# On success, writes admin_ops_job_heartbeats (Edge Monitor) on production.

name: Poker catalog sync (production)

on:
  workflow_dispatch:

concurrency:
  group: poker-catalog-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync poker tournament catalog to production
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: npm run poker:catalog:sync:production
