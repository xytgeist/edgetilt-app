# Weekly NFL EPA (nflverse) + CFB power board + UFC Stats fighter metrics
# (refresh roster + insert upcoming/recent UFC card names) 
# + Sleeper PVAL refresh (depth band + week fantasy seat; skips overrides)
# + TWO·DEEP hole-fill after Sleeper (OL / empty TE-WR depth only; polite scrape).
#
# Schedule: Tuesdays 14:00 UTC (~7:00am PT) → test AND production.
# Manual: workflow_dispatch; set sync_production=false to skip prod.
#
# Required GitHub repo secrets:
#   SUPABASE_URL_TEST / SUPABASE_SERVICE_ROLE_KEY_TEST
#   SUPABASE_URL_PRODUCTION / SUPABASE_SERVICE_ROLE_KEY_PRODUCTION
#   CFBD_API_KEY  (https://collegefootballdata.com/key)

name: Syndicate football metrics sync

on:
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      sync_production:
        description: 'Also upsert production Supabase (default true)'
        type: boolean
        default: true

concurrency:
  group: syndicate-football-metrics-sync
  cancel-in-progress: false

jobs:
  sync-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync NFL EPA metrics (test)
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_ROLE_KEY_TEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
        run: npm run syndicate:sync-nfl-metrics:test

      - name: Sync CFB Elo/SRS power board (test)
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_ROLE_KEY_TEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: npm run syndicate:sync-cfb-power:test

      - name: Sync UFC fighter metrics from UFC Stats (test)
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_ROLE_KEY_TEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
        run: npm run syndicate:sync-ufc-metrics:test

      - name: Refresh NFL PVALs from Sleeper (test)
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_ROLE_KEY_TEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
        run: npm run syndicate:pval-sleeper:refresh:test

      - name: TWO·DEEP PVAL hole-fill (test)
        continue-on-error: true
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_ROLE_KEY_TEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
        run: npm run syndicate:pval-twodeep:apply:test

      - name: NFL trench follow-up nudge (does not fail this sync)
        continue-on-error: true
        env:
          SUPABASE_URL_TEST: ${{ secrets.SUPABASE_URL_TEST }}
          SUPABASE_SERVICE_ROLE_KEY_TEST: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
        run: node scripts/syndicate-trench-followup-nudge.mjs --post-theo

  sync-production:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_production == true) }}
    needs: sync-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync NFL EPA metrics (production)
        id: prod_nfl_epa
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: npm run syndicate:sync-nfl-metrics:production

      - name: Heartbeat NFL EPA
        if: always() && steps.prod_nfl_epa.outcome != 'skipped'
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: node scripts/record-ops-job-heartbeat.mjs --target=production --job-id=syndicate_weekly_nfl_epa --status=${{ steps.prod_nfl_epa.outcome == 'success' && 'ok' || 'failed' }}

      - name: Sync CFB Elo/SRS power board (production)
        id: prod_cfb_power
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: npm run syndicate:sync-cfb-power:production

      - name: Heartbeat CFB power
        if: always() && steps.prod_cfb_power.outcome != 'skipped'
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: node scripts/record-ops-job-heartbeat.mjs --target=production --job-id=syndicate_weekly_cfb_power --status=${{ steps.prod_cfb_power.outcome == 'success' && 'ok' || 'failed' }}

      - name: Sync UFC fighter metrics from UFC Stats (production)
        id: prod_ufc
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: npm run syndicate:sync-ufc-metrics:production

      - name: Heartbeat UFC metrics
        if: always() && steps.prod_ufc.outcome != 'skipped'
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: node scripts/record-ops-job-heartbeat.mjs --target=production --job-id=syndicate_weekly_ufc_metrics --status=${{ steps.prod_ufc.outcome == 'success' && 'ok' || 'failed' }}

      - name: Refresh NFL PVALs from Sleeper (production)
        id: prod_pval_sleeper
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: npm run syndicate:pval-sleeper:refresh:production

      - name: Heartbeat Sleeper PVAL
        if: always() && steps.prod_pval_sleeper.outcome != 'skipped'
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: node scripts/record-ops-job-heartbeat.mjs --target=production --job-id=syndicate_weekly_pval_sleeper --status=${{ steps.prod_pval_sleeper.outcome == 'success' && 'ok' || 'failed' }}

      - name: TWO·DEEP PVAL hole-fill (production)
        id: prod_pval_twodeep
        continue-on-error: true
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: npm run syndicate:pval-twodeep:apply:production

      - name: Heartbeat TWO·DEEP
        if: always() && steps.prod_pval_twodeep.outcome != 'skipped'
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: node scripts/record-ops-job-heartbeat.mjs --target=production --job-id=syndicate_weekly_pval_twodeep --status=${{ steps.prod_pval_twodeep.outcome == 'success' && 'ok' || 'failed' }}

      - name: Record Edge Monitor heartbeat (ok)
        if: success()
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: >
          node scripts/record-ops-job-heartbeat.mjs
          --target=production
          --job-id=syndicate_football_metrics_sync_production
          --status=ok
          --message=NFL+CFB+UFC+PVAL sync ok

      - name: Record Edge Monitor heartbeat (failed)
        if: failure()
        env:
          SUPABASE_URL_PRODUCTION: ${{ secrets.SUPABASE_URL_PRODUCTION }}
          SUPABASE_SERVICE_ROLE_KEY_PRODUCTION: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: >
          node scripts/record-ops-job-heartbeat.mjs
          --target=production
          --job-id=syndicate_football_metrics_sync_production
          --status=failed
          --message=NFL+CFB+UFC+PVAL sync failed
