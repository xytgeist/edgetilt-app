name: EdgeTilt
options:
  bundleIdPrefix: com.edgetilt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: EdgeTilt/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: Edge
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: NO

configs:
  Debug: debug
  Release: release

targets:
  EdgeTilt:
    type: application
    platform: iOS
    sources:
      - path: EdgeTilt
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edgetilt.app
        PRODUCT_NAME: EdgeTilt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EDGE_ENV_TEST"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EDGE_ENV_PROD"
          SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  EdgeTilt Test:
    build:
      targets:
        EdgeTilt: all
    run:
      config: Debug
      askForAppToLaunch: false
    archive:
      config: Release
  EdgeTilt Prod:
    build:
      targets:
        EdgeTilt: all
    run:
      config: Release
      askForAppToLaunch: false
    archive:
      config: Release
