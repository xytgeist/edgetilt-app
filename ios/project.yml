name: EdgeTilt
options:
  bundleIdPrefix: com.edgetilt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "27.0"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.16.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: "1.4.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: EdgeTilt/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: Edge
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    CODE_SIGN_STYLE: Automatic
    # Individual paid team (Ryan / investigence@gmail.com). Same ID as the old free Personal Team.
    DEVELOPMENT_TEAM: 8932AKQW4W
    ENABLE_PREVIEWS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
configs:
  Debug: debug
  Release: release

targets:
  EdgeTilt:
    type: application
    platform: iOS
    sources:
      - path: EdgeTilt
        excludes:
          - "**/*.md"
    dependencies:
      - package: LiveKit
        product: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edgetilt.app
        PRODUCT_NAME: EdgeTilt
        CODE_SIGN_ENTITLEMENTS: EdgeTilt/EdgeTilt.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EDGE_ENV_TEST"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EDGE_ENV_PROD"
          SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  EdgeTilt Test:
    build:
      targets:
        EdgeTilt: all
    run:
      config: Debug
      askForAppToLaunch: false
    archive:
      config: Release
  EdgeTilt Prod:
    build:
      targets:
        EdgeTilt: all
    run:
      config: Release
      askForAppToLaunch: false
    archive:
      config: Release
