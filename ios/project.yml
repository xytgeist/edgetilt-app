name: EdgeTilt
options:
  bundleIdPrefix: com.edgetilt
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "27.0"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.16.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: "1.4.98"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: EdgeTilt/Info.plist
    INFOPLIST_KEY_CFBundleDisplayName: Edge
    INFOPLIST_KEY_NSCameraUsageDescription: Edge uses the camera for chat and Lounge video calls, scanning, and photo uploads.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Edge uses the microphone for voice and video calls and for videos you record in Lounge or Chat.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Edge accesses your photo library so you can attach images and videos in Lounge and Chat.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Edge can save images you capture or download to your photo library when you choose.
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Edge uses your location to show nearby casinos and location-aware poker tools while you use the app.
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    CODE_SIGN_STYLE: Automatic
    # Digiverse Ventures LLC (Apple org convert). Team ID unchanged from the Individual paid team.
    DEVELOPMENT_TEAM: 8932AKQW4W
    ENABLE_PREVIEWS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
configs:
  Debug: debug
  Release: release
  ReleaseTest: release

targets:
  EdgeTilt:
    type: application
    platform: iOS
    sources:
      - path: EdgeTilt
        excludes:
          - "**/*.md"
      # Shared ActivityAttributes … must compile into the app (sync) and the extension (UI).
      - path: EdgeTiltLiveActivity/LiveBankrollAttributes.swift
      - path: EdgeTiltLiveActivity/LiveSportsAttributes.swift
    dependencies:
      - package: LiveKit
        product: LiveKit
      - target: EdgeTiltLiveActivity
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edgetilt.app
        PRODUCT_NAME: EdgeTilt
        CODE_SIGN_ENTITLEMENTS: EdgeTilt/EdgeTilt.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EDGE_ENV_TEST"
          TARGETED_DEVICE_FAMILY: "1,2"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EDGE_ENV_PROD"
          SWIFT_OPTIMIZATION_LEVEL: -O
          TARGETED_DEVICE_FAMILY: "1,2"

  EdgeTiltLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: EdgeTiltLiveActivity
        excludes:
          - "TeamLogos/**"
      # Bundled NFL / CFB marks for Dynamic Island / Lock Screen (AsyncImage is flaky in LA snapshots).
      # Must live under `sources` with a resources phase … XcodeGen ignores a target-level `resources:` key,
      # so a regenerate silently drops the folder from the extension.
      - path: EdgeTiltLiveActivity/TeamLogos
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edgetilt.app.LiveActivity
        PRODUCT_NAME: EdgeTiltLiveActivity
        INFOPLIST_FILE: EdgeTiltLiveActivity/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.4.98"
        INFOPLIST_KEY_CFBundleDisplayName: Edge
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG EDGE_ENV_TEST"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EDGE_ENV_PROD"
          SWIFT_OPTIMIZATION_LEVEL: -O
        ReleaseTest:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) EDGE_ENV_TEST"
          SWIFT_OPTIMIZATION_LEVEL: -O

schemes:
  EdgeTilt Test:
    build:
      targets:
        EdgeTilt: all
    run:
      config: Debug
      askForAppToLaunch: false
    archive:
      config: Release
  # Daily sim / Xcode Cloud TestFlight Internal (lvslotpro.com). Do not archive locally.
  EdgeTilt Test Fast:
    build:
      targets:
        EdgeTilt: all
    run:
      config: ReleaseTest
      askForAppToLaunch: false
    archive:
      config: ReleaseTest
  EdgeTilt Prod:
    build:
      targets:
        EdgeTilt: all
    run:
      config: Release
      askForAppToLaunch: false
      postActions:
        - name: Stamp App Store status bar
          settingsTarget: EdgeTilt
          script: '"${SRCROOT}/scripts/stamp-app-store-status-bar.sh"'
    archive:
      config: Release
  # Embed-only … do not Run this scheme; use EdgeTilt Test Fast.
  EdgeTiltLiveActivity:
    build:
      targets:
        EdgeTiltLiveActivity: all
        EdgeTilt: all
    run:
      config: Debug
      askForAppToLaunch: true
    archive:
      config: Release
