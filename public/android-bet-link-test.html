<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Android bet link test</title>
<script>
  // ?go=<url>&via=meta|js forwards without a user gesture (the app-link handoff needs one).
  (function () {
    var q = new URLSearchParams(location.search)
    var go = q.get('go')
    if (!go || !/^https:\/\/([a-z0-9-]+\.)*(kalshi\.com|polymarket\.us)\//i.test(go)) return
    if (q.get('via') === 'js') {
      window.addEventListener('load', function () { setTimeout(function () { location.replace(go) }, 50) })
    } else {
      document.write('<meta http-equiv="refresh" content="0;url=' + go.replace(/"/g, '%22') + '">')
    }
  })()
</script>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 20px; background: #111; color: #eee; }
  a { display: block; margin: 14px 0; padding: 14px; border-radius: 10px; background: #1f2937; color: #6ee7b7; text-decoration: none; }
  small { color: #9ca3af; display: block; margin-top: 4px; }
  code { font-size: 11px; word-break: break-all; color: #9ca3af; }
</style>
</head>
<body>
<h2>Android bet link test</h2>
<p>Tap each one with the Kalshi / Polymarket apps installed. Note which open the <b>web ticket</b> vs the <b>app</b>.</p>
<div id="links"></div>
<p><code id="ua"></code></p>
<script>
  var KALSHI = 'https://kalshi.com/markets/kxnflgame/professional-football-game/kxnflgame-26oct01pitcle?op_market_ticker=KXNFLPASSYDS-26OCT01PITCLE-PITARODGERS8-225&op_order_side=no&op_side=BUY&op_order_type=dollars'
  var POLY = 'https://polymarket.us/sports/nfl/nfl-pit-cle-2026-10-01?marketSlug=astatc-nfl-pit-cle-2026-10-01-pyd-aarrod-gte225&outcomeId=1106245-short'
  function intent(u) {
    var p = new URL(u)
    return 'intent://' + p.host + p.pathname + p.search + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(u) + ';end'
  }
  function hop(u, via) {
    return location.pathname + '?via=' + via + '&go=' + encodeURIComponent(u)
  }
  var rows = [
    ['K1 Kalshi plain link', KALSHI, 'what the site did before 1.4.896'],
    ['K2 Kalshi Chrome intent', intent(KALSHI), 'what 1.4.896 does now'],
    ['K3 Kalshi via our page (meta refresh)', hop(KALSHI, 'meta'), 'two hops, no tap on the second'],
    ['K4 Kalshi via our page (JS redirect)', hop(KALSHI, 'js'), 'two hops, no tap on the second'],
    ['P1 Polymarket plain link', POLY, 'Rodgers 225+ No'],
    ['P2 Polymarket via our page (meta refresh)', hop(POLY, 'meta'), 'keeps you on web if the hop works'],
  ]
  var box = document.getElementById('links')
  rows.forEach(function (r) {
    var a = document.createElement('a')
    a.href = r[1]
    a.innerHTML = r[0] + '<small>' + r[2] + '</small>'
    box.appendChild(a)
  })
  document.getElementById('ua').textContent = navigator.userAgent
</script>
</body>
</html>
