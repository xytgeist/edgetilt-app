<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Returning to EdgeTilt…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
      }
      a.btn {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.85rem 1.25rem;
        border-radius: 999px;
        background: #38bdf8;
        color: #082f49;
        font-weight: 700;
        text-decoration: none;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.4;
      }
      .muted {
        color: #a1a1aa;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div>
      <p id="msg">Returning to EdgeTilt…</p>
      <p class="muted">Tap below if the app does not open automatically.</p>
      <p><a class="btn" id="open" href="#">Open EdgeTilt</a></p>
      <p class="muted"><a id="web" href="/" style="color: #a1a1aa">Continue in browser</a></p>
    </div>
    <script>
      (function () {
        var q = window.location.search || '?tab=fantasy&yahoo=linked'
        if (q.charAt(0) !== '?') q = '?' + q
        var spa = '/' + q
        // Shipped IPA maps live-session → https://<site>/?<query> in the WKWebView.
        var app = 'edgetilt://live-session' + q
        var open = document.getElementById('open')
        var web = document.getElementById('web')
        open.setAttribute('href', app)
        web.setAttribute('href', spa)

        function tryOpenApp() {
          window.location.href = app
        }

        // Auto-attempt. Do NOT auto-navigate to the SPA … that left people on a
        // logged-out Safari login modal instead of the IPA. User can tap the button.
        setTimeout(tryOpenApp, 80)
        setTimeout(tryOpenApp, 600)
      })()
    </script>
  </body>
</html>
