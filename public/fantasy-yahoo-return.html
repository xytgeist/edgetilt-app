<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Returning to EdgeTilt…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #09090b;
        color: #fafafa;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
      }
      a {
        color: #38bdf8;
        font-weight: 600;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.4;
      }
      .muted {
        color: #a1a1aa;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div>
      <p id="msg">Returning to EdgeTilt…</p>
      <p class="muted">If the app does not open, tap below.</p>
      <p><a id="open" href="#">Open EdgeTilt</a></p>
    </div>
    <script>
      (function () {
        var q = window.location.search || '?tab=fantasy&yahoo=linked'
        if (q.charAt(0) !== '?') q = '?' + q
        var spa = '/' + q
        // live-session is already handled by the shipped IPA (Live Activity taps).
        // It maps query → https://<site>/?<query> inside the WKWebView.
        var app = 'edgetilt://live-session' + q
        var open = document.getElementById('open')
        open.setAttribute('href', app)
        open.addEventListener('click', function (e) {
          e.preventDefault()
          window.location.href = app
        })
        window.location.href = app
        setTimeout(function () {
          window.location.replace(spa)
        }, 900)
      })()
    </script>
  </body>
</html>
